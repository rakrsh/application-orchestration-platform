name: Security Scanning - SAST & Dependencies

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sast-semgrep:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --sarif --output=semgrep.sarif \
            --config="p/security-audit" \
            --config="p/python" \
            --config="p/django" \
            --config="p/flask" \
            --config="p/owasp-top-ten" || true

      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sast-bandit:
    name: Python Security (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Set up Python
        uses: actions/setup-python@v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit on Python code
        run: |
          bandit -r backend/fastapi/app/ \
                  -f json \
                  -o bandit-report.json \
                  --severity-level medium
        continue-on-error: true

      - name: Convert Bandit to SARIF
        run: |
          pip install bandit-sarif-formatter
          bandit -r backend/fastapi/app/ \
                  -f sarif \
                  -o bandit.sarif \
                  --severity-level medium
        continue-on-error: true

      - name: Upload Bandit results
        uses: github/codeql-action/upload-sarif@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  dependency-python:
    name: Python Dependencies (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Set up Python
        uses: actions/setup-python@v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit \
            --desc \
            --skip-editable \
            --format json \
            --output pip-audit-report.json
        continue-on-error: true

      - name: Report pip-audit findings
        run: |
          if [ -f pip-audit-report.json ]; then
            echo "## Python Dependency Vulnerabilities" >> $GITHUB_STEP_SUMMARY
            python -m json.tool pip-audit-report.json >> $GITHUB_STEP_SUMMARY || cat pip-audit-report.json
          fi
        continue-on-error: true

      - name: Fail on critical vulnerabilities
        run: |
          pip-audit --skip-editable --output json | \
            jq -e '.vulnerabilities[] | select(.vulnerability.severity == "critical")' && \
            exit 1 || exit 0

  dependency-npm:
    name: Node Dependencies (npm audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Set up Node.js
        uses: actions/setup-node@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Run npm audit
        working-directory: frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Generate npm audit report
        working-directory: frontend
        run: npm audit --json > npm-audit-report.json
        continue-on-error: true

      - name: Report npm findings
        run: |
          if [ -f frontend/npm-audit-report.json ]; then
            echo "## Node.js Dependency Vulnerabilities" >> $GITHUB_STEP_SUMMARY
            cat frontend/npm-audit-report.json | jq '.metadata.vulnerabilities' >> $GITHUB_STEP_SUMMARY || true
          fi
        continue-on-error: true

  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Set up Python
        uses: actions/setup-python@v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run secrets scan
        run: |
          detect-secrets scan \
            --all-files \
            --force-use-all-plugins \
            --baseline .secrets.baseline \
            || true
        continue-on-error: true

      - name: Validate secrets not found
        run: |
          if grep -r "password\|api_key\|secret\|token" backend/fastapi/app/ \
             --include="*.py" \
             --exclude-dir=__pycache__ \
             --exclude-dir=.venv \
             2>/dev/null | grep -v "# noqa\|def get_secret\|SECRETS_"; then
            echo "⚠️ Potential secrets found in code. Review and remove."
            exit 1
          fi
        continue-on-error: true

  linting:
    name: Code Quality (Linting)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Set up Python
        uses: actions/setup-python@v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          pip install flake8 black isort pylint

      - name: Run Black (code formatting)
        run: black backend/fastapi/app/ --check
        continue-on-error: true

      - name: Run isort (import sorting)
        run: isort backend/fastapi/app/ --check-only
        continue-on-error: true

      - name: Run Flake8
        run: flake8 backend/fastapi/app/ --max-line-length=120
        continue-on-error: true

      - name: Run Pylint
        run: pylint backend/fastapi/app/ --disable=missing-docstring
        continue-on-error: true

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Set up Python
        uses: actions/setup-python@v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r backend/fastapi/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest backend/fastapi/tests/ \
            --cov=backend.fastapi.app \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=json \
            --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          files: ./coverage.json
          flags: unittests
          name: codecov-umbrella

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          GITHUB_TOKEN: ${{ github.token }}

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sast-bandit, dependency-python, dependency-npm, secrets-detection]
    if: always()
    permissions:
      pull-requests: write

    steps:
      - name: Create security check summary
        run: |
          echo "## 🔒 Security Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Semgrep) | ${{ needs.sast-semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Bandit) | ${{ needs.sast-bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Dependencies | ${{ needs.dependency-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node Dependencies | ${{ needs.dependency-npm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Detection | ${{ needs.secrets-detection.result }} |" >> $GITHUB_STEP_SUMMARY
