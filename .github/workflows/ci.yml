name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  quality-checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit black isort flake8

      - name: Run pre-commit
        run: |
          pre-commit run --all-files

      - name: Run backend tests
        run: |
          python -m pip install -r backend/fastapi/requirements.txt
          python -m unittest discover -s backend/fastapi/tests -v

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Verify observability config
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path('.')
          required = [
              root / 'backend/fastapi/app/main.py',
              root / 'backend/fastapi/requirements.txt',
              root / 'frontend/package.json',
              root / 'docs/architecture/C4_architecture.md',
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')
          print('Observability files present')
          PY
