name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-checks:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Set up Python
        uses: actions/setup-python@v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit black isort flake8

      - name: Run pre-commit
        run: |
          pre-commit run --all-files

      - name: Run backend tests
        run: |
          python -m pip install -r backend/fastapi/requirements.txt
          python -m unittest discover -s backend/fastapi/tests -v

  frontend-build:
    name: Build frontend package
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Set up Node.js
        uses: actions/setup-node@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Verify observability config
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path('.')
          required = [
              root / 'backend/fastapi/app/main.py',
              root / 'backend/fastapi/requirements.txt',
              root / 'frontend/package.json',
              root / 'docs/architecture/C4_architecture.md',
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')
          print('Observability files present')
          PY

      - name: Upload frontend distribution artifact
        uses: actions/upload-artifact@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          name: frontend-dist
          path: frontend/dist/temp-app/browser
          retention-days: 14

  backend-package:
    name: Package backend
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Set up Python
        uses: actions/setup-python@v5 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          python-version: '3.12'

      - name: Create backend package bundle
        run: |
          mkdir -p dist/backend
          cp -r backend/fastapi/app dist/backend/
          cp backend/fastapi/requirements.txt dist/backend/
          cp backend/fastapi/Dockerfile dist/backend/
          tar -czf dist/backend-package.tar.gz -C dist/backend .

      - name: Upload backend package artifact
        uses: actions/upload-artifact@v4 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
        with:
          name: backend-package
          path: dist/backend-package.tar.gz
          retention-days: 14

  docker-build:
    name: Build Docker packages
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-package]
    steps:
      - uses: actions/checkout@v7 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # nosemgrep: yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

      - name: Build backend container image
        run: |
          docker build -t aop-backend:latest ./backend/fastapi

      - name: Build frontend container image
        run: |
          docker build -t aop-frontend:latest ./frontend
