repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

# Python formatting + linting (expects tools available in environment or CI)
  - repo: local
    hooks:
      - id: python-black
        name: black (format Python)
        entry: python -m black backend/ --quiet
        language: system
        types: [python]
      - id: python-isort
        name: isort (sort imports)
        entry: python -m isort backend/ --profile black
        language: system
        types: [python]
      - id: python-flake8
        name: flake8 (lint Python)
        entry: python -m flake8 backend/
        language: system
        types: [python]

# Frontend formatting + linting using npm (runs only for files under frontend/)
      - id: npm-install-frontend
        name: npm ci (frontend dependencies)
        entry: npm ci --prefix frontend
        language: system
        always_run: false
      - id: npm-lint-frontend
        name: npm run lint (frontend)
        entry: npm run lint --prefix frontend
        language: system
        files: ^frontend/.*\.(ts|html|css|scss|js)$
      - id: npm-format-frontend
        name: npm run format (frontend)
        entry: npm run format --prefix frontend
        language: system
        files: ^frontend/.*\.(ts|html|css|scss|js)$
