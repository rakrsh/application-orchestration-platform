repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

# Python formatting + linting (expects tools available in environment or CI)
  - repo: local
    hooks:
      - id: python-black
        name: black (format Python)
        entry: black backend/ --quiet
        language: python
        additional_dependencies: [black]
        types: [python]
        pass_filenames: false
      - id: python-isort
        name: isort (sort imports)
        entry: isort backend/ --profile black
        language: python
        additional_dependencies: [isort]
        types: [python]
        pass_filenames: false
      - id: python-flake8
        name: flake8 (lint Python)
        entry: flake8 backend/
        language: python
        additional_dependencies: [flake8]
        types: [python]
        pass_filenames: false

# Frontend formatting + linting using npm (runs only for files under frontend/)
      - id: npm-lint-frontend
        name: npm run lint (frontend)
        entry: bash -lc 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|html|css|scss|js)$
      - id: npm-format-frontend
        name: npm run format (frontend)
        entry: bash -lc 'cd frontend && npm run format'
        language: system
        files: ^frontend/.*\.(ts|html|css|scss|js)$
