version: '3.8'
services:
  keycloak:
    image: quay.io/keycloak/keycloak:21.1.1
    command: start-dev --http-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  openfga:
    image: openfga/openfga:0.8.0
    environment:
      - OPENFGA_SERVE_HOST=0.0.0.0
    ports:
      - "8081:8081"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:7.3.0
    ports:
      - "4180:4180"
    environment:
      - OAUTH2_PROXY_PROVIDER=oidc
      - OAUTH2_PROXY_CLIENT_ID=example
      - OAUTH2_PROXY_CLIENT_SECRET=example
      - OAUTH2_PROXY_COOKIE_SECRET=examplecookie
      - OAUTH2_PROXY_REDIRECT_URL=http://localhost:4180/oauth2/callback
      - OAUTH2_PROXY_OIDC_ISSUER_URL=http://localhost:8080
    depends_on:
      - keycloak

  fastapi:
    build: ./backend/fastapi
    ports:
      - "8000:8000"
    environment:
      - OPENFGA_ENDPOINT=http://openfga:8081
    depends_on:
      - keycloak
      - openfga
