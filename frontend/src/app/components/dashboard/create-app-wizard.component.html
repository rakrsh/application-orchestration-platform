<section class="wizard-shell glass-panel">
  <div class="wizard-tabs">
    <button type="button" [class.active]="activeStep === 'git'" (click)="selectStep('git')">Git Repository URL</button>
    <button type="button" [class.active]="activeStep === 'zip'" (click)="selectStep('zip')">Upload ZIP Bundle</button>
  </div>

  <div class="wizard-content">
    <ng-container *ngIf="activeStep === 'git'">
      <div class="field-group">
        <label>Repository URL</label>
        <input type="text" [(ngModel)]="payload.gitUrl" placeholder="https://github.com/owner/repo" />
      </div>
      <div class="field-group split">
        <div>
          <label>Branch</label>
          <input type="text" [(ngModel)]="payload.gitBranch" />
        </div>
        <div>
          <label>Buildfile path</label>
          <input type="text" [(ngModel)]="payload.buildfilePath" placeholder="Dockerfile or build.yaml" />
        </div>
      </div>
      <div class="field-group">
        <label>SSH secret</label>
        <select>
          <option>SSH key: deploy-key</option>
          <option>GitHub PAT</option>
        </select>
      </div>
    </ng-container>

    <ng-container *ngIf="activeStep === 'zip'">
      <div
        class="dropzone"
        (drop)="onDrop($event)"
        (dragover)="onDragOver($event)"
      >
        <p>{{ dropMessage }}</p>
        <input type="file" accept=".zip,.tar.gz" (change)="handleFileInput($event)" />
      </div>
      <div class="runtime-note" *ngIf="runtimeHint">
        {{ runtimeHint }}
      </div>
      <div class="field-group">
        <label>Target OS</label>
        <select [(ngModel)]="payload.targetOs">
          <option value="linux">Linux</option>
          <option value="windows">Windows</option>
          <option value="macos">macOS</option>
        </select>
      </div>
    </ng-container>

    <div class="env-grid">
      <div class="env-header">
        <span>Environment variables</span>
        <button type="button" class="secondary" (click)="addEnvRow()">Add row</button>
      </div>
      <div *ngFor="let row of envRows; let i = index" class="env-row">
        <input
          type="text"
          placeholder="Key"
          [(ngModel)]="row.key"
          (ngModelChange)="onEnvKeyChange(i, $event)"
        />
        <input
          type="text"
          placeholder="Value"
          [(ngModel)]="row.value"
          (ngModelChange)="onEnvValueChange(i, $event)"
        />
        <button type="button" (click)="removeEnvRow(i)">Remove</button>
      </div>
    </div>

    <div class="wizard-actions">
      <button type="button" class="primary" (click)="submit()">Submit</button>
    </div>
  </div>
</section>
