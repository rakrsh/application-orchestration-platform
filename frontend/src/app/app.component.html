<div class="app-shell">
  <app-header></app-header>
  <main class="app-main">
    <ng-container *ngIf="state.activeTab$ | async as activeTab">
      <app-overview-tab
        *ngIf="activeTab === 'overview'"
        [applications]="applications"
        [osFilter]="(state.osFilter$ | async) ?? 'all'"
        [deploymentMode]="(state.deploymentMode$ | async) ?? 'kubernetes'"
        [persona]="(state.persona$ | async) ?? 'platform-admin'"
      ></app-overview-tab>

      <app-create-app-wizard *ngIf="activeTab === 'create'"></app-create-app-wizard>

      <app-telemetry-tab *ngIf="activeTab === 'telemetry'" ></app-telemetry-tab>
    </ng-container>
  </main>
</div>
