site_name: Application Orchestration Platform
site_description: Documentation for the application orchestration platform
site_author: CapOS
repo_url: https://github.com/rakrsh/application-orchestration-platform
repo_name: rakrsh/application-orchestration-platform
nav:
  - Home: index.md
  - Architecture: architecture/C4_architecture.md
  - Backend: backend/fastapi/README.md
  - Frontend: frontend/README.md
  - Auth:
      - Keycloak: auth/KEYCLOAK_README.md
      - OAuth2 Proxy: auth/OAUTH2_PROXY_README.md
      - OpenFGA: auth/OPENFGA_README.md
  - Operations:
      - Development Guide: development-guide.md
  - Security & Compliance:
      - CRA Plan: COMPLIANCE_CRA_PLAN.md
      - Executive Summary: CRA_EXECUTIVE_SUMMARY.md
      - Quickstart Checklist: QUICKSTART_CRA_CHECKLIST.md
      - Security Requirements: SECURITY_REQUIREMENTS.md
      - Threat Model: architecture/THREAT_MODEL.md
      - Secure Coding: SECURE_CODING.md
      - Build & Release Process: BUILD_RELEASE_PROCESS.md
      - Testing Checklist: SECURITY_TESTING_CHECKLIST.md
      - SBOM: SBOM.md
      - Vulnerability Disclosure: SECURITY.md
      - Vulnerability Assessment: VULNERABILITY_ASSESSMENT.md
      - Incident Response: INCIDENT_RESPONSE.md
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rakrsh/application-orchestration-platform
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - attr_list
  - toc:
      permalink: true
plugins: []
